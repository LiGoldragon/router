[package]
name         = "router"
version      = "0.11.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/router"
description  = "Persona message router and delivery state machine."
publish      = false

[lib]
name = "router"
path = "src/lib.rs"

[[bin]]
name = "router"
path = "src/bin/router.rs"
required-features = ["dotos-text"]

[[bin]]
name = "router-daemon"
path = "src/main.rs"

[[bin]]
name = "meta-router"
path = "src/bin/meta_router.rs"
required-features = ["dotos-text"]

[[bin]]
name = "router-write-configuration"
path = "src/bin/router_write_configuration.rs"
required-features = ["dotos-text"]

[[bin]]
name = "router-write-bootstrap"
path = "src/bin/router_write_bootstrap.rs"
required-features = ["dotos-text"]

[[bin]]
name = "router-forward-witness"
path = "src/bin/router_forward_witness.rs"
required-features = ["witness"]

[dependencies]
# Encrypted authenticated peer session (primary-nbmq.6): ephemeral X25519 ECDH
# for per-session forward secrecy, ChaCha20-Poly1305 AEAD for session traffic,
# blake3 as the KDF binding the session keys to the handshake transcript, and a
# CSPRNG for challenges + ephemeral keys. The router still holds no long-term
# keys; the BLS master key stays inside criome.
blake3                = "1"
chacha20poly1305      = "0.10"
rand_core             = { version = "0.6", features = ["getrandom"] }
x25519-dalek          = "2"
zeroize               = "1"
kameo                 = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", default-features = false, features = ["macros", "tracing"] }
meta-signal-router    = { git = "https://github.com/LiGoldragon/meta-signal-router.git", rev = "422ec113b987b1ff8072242df7283ee3852f49d1", default-features = false }
dotos                  = { git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3", optional = true }
nota             = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", branch = "main" }
rkyv                  = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine           = { git = "https://github.com/LiGoldragon/sema-engine.git", branch = "main" }
signal-persona        = { git = "https://github.com/LiGoldragon/signal-persona.git", branch = "main" }
signal-frame          = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-frame-interface = { package = "signal-frame", git = "https://github.com/LiGoldragon/signal-frame.git", rev = "01676293a623d97b65e320d4138c4b480c6d5dad" }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness.git", branch = "main" }
signal-mind   = { git = "https://github.com/LiGoldragon/signal-mind.git", branch = "main" }
signal-message = { git = "https://github.com/LiGoldragon/signal-message.git", branch = "main" }
signal-router = { git = "https://github.com/LiGoldragon/signal-router.git", rev = "f1fda7e130f583cd673cc4d6acfc05a753dfe449", default-features = false }
signal-standard = { git = "https://github.com/LiGoldragon/signal-standard.git", rev = "d5a4a545e61dafec30667f2af38ca503ab6d6d3f", default-features = false }
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome.git", branch = "main", default-features = false }
signal-mirror = { git = "https://github.com/LiGoldragon/signal-mirror.git", rev = "d57830076840f0e1ef89352823d7b0356a7c96df", optional = true }
thiserror             = "2"
tokio                 = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
triad-runtime         = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[features]
default = []
dotos-text = ["dep:dotos", "meta-signal-router/dotos-text", "signal-router/dotos-text"]
# The two-VM criome-auth witness sender bin (router-forward-witness). Pulls in
# signal-mirror so the bin can build the forwarded Append payload, and dotos-text
# so the typed router reply renders as Dotos on stdout.
witness = ["dep:signal-mirror", "dotos-text"]

[dev-dependencies]
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome.git", branch = "main", default-features = false }
signal-mirror = { git = "https://github.com/LiGoldragon/signal-mirror.git", rev = "d57830076840f0e1ef89352823d7b0356a7c96df" }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }

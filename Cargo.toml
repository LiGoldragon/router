[package]
name         = "persona-router"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/persona-router"
description  = "Persona message router and delivery state machine."
publish      = false

[lib]
name = "persona_router"
path = "src/lib.rs"

[[bin]]
name = "persona-router-daemon"
path = "src/main.rs"

[dependencies]
kameo                 = { version = "0.20", default-features = false, features = ["macros", "tracing"] }
nota-codec            = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
nota-config           = { git = "https://github.com/LiGoldragon/nota-config.git", branch = "main" }
persona-harness       = { git = "https://github.com/LiGoldragon/persona-harness.git", branch = "main" }
rkyv                  = "0.8"
sema                  = { git = "https://github.com/LiGoldragon/sema.git" }
signal-core           = { git = "https://github.com/LiGoldragon/signal-core.git" }
signal-persona-auth   = { git = "https://github.com/LiGoldragon/signal-persona-auth.git" }
signal-persona-harness = { git = "https://github.com/LiGoldragon/signal-persona-harness.git" }
signal-persona-mind   = { git = "https://github.com/LiGoldragon/signal-persona-mind.git" }
signal-persona-message = { git = "https://github.com/LiGoldragon/signal-persona-message.git" }
signal-persona-router = { git = "https://github.com/LiGoldragon/signal-persona-router.git" }
signal-persona        = { git = "https://github.com/LiGoldragon/signal-persona.git" }
thiserror             = "2"
tokio                 = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"
unused = "warn"
dead_code = "warn"

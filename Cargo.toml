[package]
name         = "router"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/router"
description  = "Persona message router and delivery state machine."
publish      = false

[lib]
name = "router"
path = "src/lib.rs"

[[bin]]
name = "router-daemon"
path = "src/main.rs"

[dependencies]
kameo                 = { version = "0.20", default-features = false, features = ["macros", "tracing"] }
meta-signal-router    = { git = "https://github.com/LiGoldragon/meta-signal-router.git", branch = "main" }
nota-codec            = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
nota-next             = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
rkyv                  = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema                  = { git = "https://github.com/LiGoldragon/sema.git" }
signal-engine-management = { git = "https://github.com/LiGoldragon/signal-engine-management.git", branch = "main" }
signal-frame          = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-persona-origin   = { git = "https://github.com/LiGoldragon/signal-persona-origin.git" }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness.git" }
signal-mind   = { git = "https://github.com/LiGoldragon/signal-mind.git" }
signal-message = { git = "https://github.com/LiGoldragon/signal-message.git", branch = "main" }
signal-router = { git = "https://github.com/LiGoldragon/signal-router.git", branch = "main" }
signal-persona        = { git = "https://github.com/LiGoldragon/signal-persona.git" }
thiserror             = "2"
tokio                 = { version = "1", features = ["rt-multi-thread", "macros"] }
triad-runtime         = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[features]
default = []
nota-text = ["dep:nota-next"]

[build-dependencies]
schema-rust-next = { git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
